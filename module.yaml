
# module.yaml
product: jvm/app

settings:
  ktor: enabled
  kotlin:
    serialization: enabled
  jvm:
    mainClass: nl.brul.api.ApplicationKt

dependencies:
  # DEFAULT: Generated by the Ktor project template.
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.server.config.yaml
  - ch.qos.logback:logback-classic:1.5.38

  # ADDED: JSON serialization and centralized error handling.
  - $ktor.server.contentNegotiation
  - $ktor.serialization.kotlinx.json
  - $ktor.server.statusPages

  # ADDED: JWT authentication and protected routes.
  - $ktor.server.auth
  - $ktor.server.auth.jwt

  # ADDED: SQL database and Kotlin database access.
  - com.h2database:h2:2.3.232
  - org.jetbrains.exposed:exposed-core:0.61.0
  - org.jetbrains.exposed:exposed-jdbc:0.61.0

  # ADDED: Secure password hashing.
  - org.mindrot:jbcrypt:0.4

  # ADDED: JWT generation and verification.
  - com.auth0:java-jwt:4.6.0

  # ADDED: Load local environment configuration from .env.
  - io.github.cdimascio:dotenv-kotlin:6.5.1

test-dependencies:
  # DEFAULT: Generated by the Ktor project template.
  - $ktor.server.testHost
