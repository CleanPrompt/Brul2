<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brul</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 24px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        section {
            background: white;
            padding: 24px;
            margin-bottom: 24px;
            border-radius: 8px;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 16px;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .danger {
            background: #b42318;
        }

        .secondary {
            background: #555;
        }

        .report {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 16px;
            margin-top: 16px;
        }

        .report h3 {
            margin-top: 0;
        }

        .report-meta {
            color: #666;
            font-size: 14px;
        }

        .report-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .report-actions button {
            margin-top: 8px;
        }

        #message {
            display: none;
            padding: 12px;
            margin-bottom: 24px;
            border-radius: 6px;
        }

        .success {
            display: block !important;
            background: #e7f6ec;
            color: #176b32;
        }

        .error {
            display: block !important;
            background: #fdecec;
            color: #a61b1b;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>🐻 Brul</h1>
    <p>Bekijk en meld wat er in jouw buurt gebeurt.</p>
</header>

<main>

    <div id="message"></div>

    <section>
        <h2>Nieuwe melding</h2>

        <form id="reportForm">

            <label for="type">Type melding</label>

            <select id="type">
                <option value="SAFETY">Veiligheid</option>
                <option value="NUISANCE">Overlast</option>
                <option value="HELP">Hulpvraag</option>
            </select>

            <label for="title">Titel</label>

            <input
                    id="title"
                    type="text"
                    required
                    placeholder="Bijvoorbeeld: Kapotte straatverlichting"
            >

            <label for="description">Beschrijving</label>

            <textarea
                    id="description"
                    placeholder="Wat is er aan de hand?"
            ></textarea>

            <label for="photo">Foto URL</label>

            <input
                    id="photo"
                    type="text"
                    placeholder="Optioneel"
            >

            <label for="latitude">Latitude</label>

            <input
                    id="latitude"
                    type="number"
                    step="any"
                    required
                    value="52.08"
            >

            <label for="longitude">Longitude</label>

            <input
                    id="longitude"
                    type="number"
                    step="any"
                    required
                    value="4.31"
            >

            <div id="urgencyContainer">

                <label for="urgency">Urgentie</label>

                <select id="urgency">
                    <option value="LOW">Laag</option>
                    <option value="MEDIUM" selected>Gemiddeld</option>
                    <option value="HIGH">Hoog</option>
                </select>

            </div>

            <div id="nuisanceTypeContainer" class="hidden">

                <label for="nuisanceType">Type overlast</label>

                <select id="nuisanceType">
                    <option value="NOISE">Geluid</option>
                    <option value="WASTE">Afval</option>
                    <option value="VANDALISM">Vandalisme</option>
                    <option value="OTHER">Anders</option>
                </select>

            </div>

            <button type="submit">
                Melding plaatsen
            </button>

        </form>
    </section>


    <section>

        <h2>Meldingen</h2>

        <button
                class="secondary"
                onclick="loadReports()"
        >
            Vernieuwen
        </button>

        <div id="reports">
            Meldingen worden geladen...
        </div>

    </section>

</main>


<script>

    const typeSelect =
        document.getElementById("type");

    const urgencyContainer =
        document.getElementById("urgencyContainer");

    const nuisanceTypeContainer =
        document.getElementById("nuisanceTypeContainer");

    const reportForm =
        document.getElementById("reportForm");

    const reportsContainer =
        document.getElementById("reports");

    const messageContainer =
        document.getElementById("message");


    typeSelect.addEventListener(
        "change",
        updateForm
    );


    reportForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            await createReport();
        }
    );


    function updateForm() {

        const type = typeSelect.value;

        urgencyContainer.classList.add("hidden");
        nuisanceTypeContainer.classList.add("hidden");

        if (type === "SAFETY") {
            urgencyContainer.classList.remove("hidden");
        }

        if (type === "NUISANCE") {
            nuisanceTypeContainer.classList.remove("hidden");
        }
    }


    async function createReport() {

        const type =
            document.getElementById("type").value;

        const title =
            document.getElementById("title").value;

        const description =
            document.getElementById("description").value || null;

        const photo =
            document.getElementById("photo").value || null;

        const latitude =
            Number(document.getElementById("latitude").value);

        const longitude =
            Number(document.getElementById("longitude").value);


        let url;

        let body = {
            title: title,
            description: description,
            photo: photo,
            latitude: latitude,
            longitude: longitude
        };


        if (type === "SAFETY") {

            url = "/reports/safety";

            body.urgency =
                document.getElementById("urgency").value;
        }


        if (type === "NUISANCE") {

            url = "/reports/nuisance";

            body.nuisanceType =
                document.getElementById("nuisanceType").value;
        }


        if (type === "HELP") {

            url = "/reports/help";
        }


        try {

            const response = await fetch(
                url,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(body)
                }
            );


            if (!response.ok) {

                showMessage(
                    "Melding kon niet worden aangemaakt.",
                    true
                );

                return;
            }


            showMessage(
                "Melding aangemaakt.",
                false
            );


            reportForm.reset();

            document.getElementById("latitude").value =
                "52.08";

            document.getElementById("longitude").value =
                "4.31";

            updateForm();

            await loadReports();

        } catch (error) {

            showMessage(
                "Kan geen verbinding maken met de server.",
                true
            );
        }
    }


    async function loadReports() {

        try {

            const response =
                await fetch("/reports");


            if (!response.ok) {

                reportsContainer.innerHTML =
                    "<p>Meldingen konden niet worden geladen.</p>";

                return;
            }


            const reports =
                await response.json();


            renderReports(reports);

        } catch (error) {

            reportsContainer.innerHTML =
                "<p>Kan geen verbinding maken met de server.</p>";
        }
    }


    function renderReports(reports) {

        reportsContainer.innerHTML = "";


        if (reports.length === 0) {

            reportsContainer.innerHTML =
                "<p>Er zijn nog geen meldingen.</p>";

            return;
        }


        reports.forEach(function (report) {

            const reportElement =
                document.createElement("div");

            reportElement.className =
                "report";


            let extraInformation = "";


            if (report.urgency) {

                extraInformation +=
                    `<p><strong>Urgentie:</strong> ${report.urgency}</p>`;
            }


            if (report.nuisanceType) {

                extraInformation +=
                    `<p><strong>Overlast:</strong> ${report.nuisanceType}</p>`;
            }


            if (report.claimedByUsername) {

                extraInformation +=
                    `<p><strong>Geclaimd door:</strong> ${report.claimedByUsername}</p>`;
            }


            reportElement.innerHTML = `

                <h3>${escapeHtml(report.title)}</h3>

                <p class="report-meta">
                    ${report.type}
                    ·
                    ${report.status}
                </p>

                <p>
                    ${escapeHtml(report.description || "Geen beschrijving")}
                </p>

                <p>
                    <strong>Locatie:</strong>
                    ${report.latitude},
                    ${report.longitude}
                </p>

                <p>
                    <strong>Aangemaakt door:</strong>
                    ${escapeHtml(report.createdByUsername)}
                </p>

                ${extraInformation}

                <div class="report-actions">

                    ${
                report.status !== "RESOLVED"
                    ? `
                                <button
                                    onclick="resolveReport('${report.id}')"
                                >
                                    Oplossen
                                </button>
                              `
                    : ""
            }

                    <button
                        class="danger"
                        onclick="deleteReport('${report.id}')"
                    >
                        Verwijderen
                    </button>

                </div>
            `;


            reportsContainer.appendChild(
                reportElement
            );
        });
    }


    async function resolveReport(id) {

        try {

            const response =
                await fetch(
                    `/reports/${id}/resolve`,
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                showMessage(
                    "Melding kon niet worden opgelost.",
                    true
                );

                return;
            }


            showMessage(
                "Melding opgelost.",
                false
            );


            await loadReports();

        } catch (error) {

            showMessage(
                "Kan geen verbinding maken met de server.",
                true
            );
        }
    }


    async function deleteReport(id) {

        const confirmed =
            confirm(
                "Weet je zeker dat je deze melding wilt verwijderen?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/reports/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                showMessage(
                    "Melding kon niet worden verwijderd.",
                    true
                );

                return;
            }


            showMessage(
                "Melding verwijderd.",
                false
            );


            await loadReports();

        } catch (error) {

            showMessage(
                "Kan geen verbinding maken met de server.",
                true
            );
        }
    }


    function showMessage(text, isError) {

        messageContainer.textContent =
            text;


        messageContainer.className =
            isError
                ? "error"
                : "success";


        setTimeout(
            function () {

                messageContainer.className = "";

            },
            3000
        );
    }


    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value;

        return div.innerHTML;
    }


    updateForm();

    loadReports();

</script>

</body>
</html>
